models:
  - name: fct_orders
    config:
      contract:
        enforced: true
    columns:
      - name: order_id
        data_type: string
        constraints:
          - type: not_null
      - name: location_id
        data_type: string
      - name: customer_id
        data_type: string
      - name: order_total
        data_type: float
      - name: tax_paid
        data_type: float
      - name: ordered_at
        data_type: timestamp
      - name: is_drink_order
        data_type: boolean
      - name: is_food_order
        data_type: boolean
      - name: order_cost
        data_type: float