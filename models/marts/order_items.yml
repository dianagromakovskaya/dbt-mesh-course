models:
  - name: order_items
    config:
      contract:
        enforced: true
    columns:
      - name: order_item_id
        data_type: string
        constraints:
          - type: not_null
      - name: order_id
        data_type: string
      - name: product_id
        data_type: string
      - name: ordered_at
        data_type: timestamp
      - name: is_drink_item
        data_type: int
      - name: is_food_item
        data_type: int
      - name: product_price
        data_type: float
      - name: supply_cost
        data_type: float